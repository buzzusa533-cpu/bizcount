<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Portal — BizCount</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="dashboard-body" data-page="staff-portal">

<!-- HEADER -->
<header class="main-header" id="mainHeader">
  <div class="header-inner">
    <a href="/pages/staff.html" class="logo">
      <span class="logo-icon"><i class="fa-solid fa-chart-line"></i></span>
      <span class="logo-text">Biz<strong>Count</strong></span>
    </a>
    <div style="flex:1;display:flex;align-items:center;gap:12px;justify-content:flex-end;">
      <span class="business-name-el" style="font-size:.82rem;color:var(--text-muted)"></span>
      <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon light-icon"><i class="fa-solid fa-sun"></i></span>
          <span class="theme-icon dark-icon"><i class="fa-solid fa-moon"></i></span>
        </button>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </div>
</header>

<div class="dashboard-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-user">
      <div class="user-avatar user-avatar-el" style="background:linear-gradient(135deg,#475569,#64748b);color:white;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;flex-shrink:0"></div>
      <div class="user-info-text">
        <div class="user-name user-name-el" style="font-size:.9rem;font-weight:700;color:var(--text-primary)"></div>
        <div class="user-role" style="font-size:.72rem;color:var(--text-muted)">Staff Member</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">My Portal</div>
      <a href="?page=overview" class="sidebar-link"><i class="fa-solid fa-house"></i> Overview</a>
      <a href="?page=sales"    class="sidebar-link"><i class="fa-solid fa-cash-register"></i> Record Sale</a>
      <a href="?page=stock"    class="sidebar-link"><i class="fa-solid fa-boxes-stacked"></i> Check Stock</a>
      <a href="?page=tasks"    class="sidebar-link"><i class="fa-solid fa-list-check"></i> My Tasks</a>
      <a href="?page=history"  class="sidebar-link"><i class="fa-solid fa-clock-rotate-left"></i> My Sales History</a>
    </nav>
    <div class="sidebar-footer">
      <div class="status-badge status-info" style="font-size:.72rem;padding:4px 10px">
        <i class="fa-solid fa-circle" style="font-size:.5rem"></i> Staff Account
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div id="pageContent">
      <div style="padding:60px;text-align:center">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--brand-primary)"></i>
        <p style="margin-top:16px;color:var(--text-muted)">Loading your portal…</p>
      </div>
    </div>
  </main>

</div>

<script src="/js/app.js"></script>
</body>
</html>
